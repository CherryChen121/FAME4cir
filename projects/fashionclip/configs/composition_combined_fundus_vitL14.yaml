# Combined fundus CIR with CLIP ViT-L/14: Internal train/val,
# selectable Internal/GRAPE/ODIR5K test.

includes:
- combined_fundus_vitL14_dataset_cfg.yaml

model_config:
  fashionclip:
    training_head_type: mtl
    clip_config:
      clip_model_name: /data0/qrchen/projects/FAME-ViL/pretrained_models/clip-vit-large-patch14
    adapter_config:
      freeze: false
      adapter_name: scaled_pa
      bottleneck: 64
      dropout: 0.0
      enable_xattn: true
      share_cross: false
      share_adapter: false
      cross_dropout: 0.0
    lr_multiplier: 100
    tasks:
    - tgir

scheduler:
  type: multi_step
  params:
    use_warmup: true
    lr_steps:
    - 1200
    - 2400
    - 4000
    lr_ratio: 0.1
    warmup_iterations: 200
    warmup_factor: 0.25

optimizer:
  type: adam_w
  params:
    lr: 1e-6
    eps: 1e-8
    weight_decay: 1e-5

evaluation:
  metrics:
    - r@k_combined_fundus

training:
  experiment_name: fashionclip_combined_fundus_vitL14_composition_xattn
  batch_size: 16
  lr_scheduler: true
  max_updates: 6000
  log_interval: 10
  checkpoint_interval: 5620
  evaluation_interval: 562
  find_unused_parameters: true
  early_stop:
    criteria: combined_fundus/r@k_combined_fundus/Avg_Recall
    minimize: false
  wandb:
    enabled: false

run_type: train_val
